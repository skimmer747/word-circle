name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every morning (about 4–5 AM Eastern): fetch the day's Wordle word into daily-word.txt and republish.
  # GitHub switches this off after 60 days without commits; it emails first, and one click turns it back on.
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # On the morning run, a failed fetch stops here so the last deploy (with words two days ahead) stays live.
      - name: Fetch the daily Wordle words
        run: npm run daily-word -- ${{ github.event_name == 'schedule' && '--strict' || '' }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
