    <path d="M160 170 C150 120 220 100 260 125 C300 80 400 90 420 135 C470 110 560 120 570 170 C620 175 640 230 600 255 C560 280 500 270 480 250 C440 280 370 275 350 245 C300 270 230 260 220 230 C170 235 140 200 160 170 Z"/>
  </g>
