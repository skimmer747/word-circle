  <use xlink:href="#cloud" transform="translate(190 290) scale(0.55)"/>
  <use xlink:href="#cloud" transform="translate(600 175) scale(0.75)"/>

  <!-- far shore and lake -->
  <path d="M0 392 C120 380 240 386 360 384 C520 378 700 390 900 382 C1100 376 1300 388 1600 380 L1600 405 L0 405 Z" fill="#2f7a3d" stroke="#26232e" stroke-width="5" stroke-linejoin="round"/>
  <rect x="0" y="403" width="1600" height="80" fill="#2f8ad6" stroke="#26232e" stroke-width="5"/>
  <path d="M180 428 h120 M520 446 h160 M860 425 h110 M1150 452 h170 M380 466 h90" stroke="#b9e6ff" stroke-width="7" stroke-linecap="round"/>

  <!-- fence -->
  <g stroke="#26232e">
    <path d="M0 448 H1600 M0 488 H1600" stroke-width="7"/>
    <path d="M20 448 V490 M64 448 V490 M108 448 V490 M152 448 V490 M196 448 V490 M240 448 V490 M284 448 V490 M328 448 V490 M372 448 V490 M416 448 V490 M460 448 V490 M504 448 V490 M548 448 V490 M592 448 V490 M636 448 V490 M680 448 V490 M724 448 V490 M768 448 V490 M812 448 V490 M856 448 V490 M900 448 V490 M944 448 V490 M988 448 V490 M1032 448 V490 M1076 448 V490 M1120 448 V490 M1164 448 V490 M1208 448 V490 M1252 448 V490 M1296 448 V490 M1340 448 V490 M1384 448 V490 M1428 448 V490 M1472 448 V490 M1516 448 V490 M1560 448 V490" stroke-width="4"/>
