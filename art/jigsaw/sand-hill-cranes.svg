    <path d="M1360 990 C1350 910 1360 860 1390 830 C1400 880 1395 940 1380 990 Z" fill="#c9262c"/>
    <path d="M1400 995 C1430 930 1480 890 1520 880 C1500 930 1450 975 1420 1000 Z" fill="#e8343a"/>
    <path d="M1350 990 C1320 950 1300 940 1270 935 C1300 960 1320 985 1340 1000 Z" fill="#3f9b3a"/>
    <path d="M1400 990 C1420 950 1450 935 1480 930 C1460 960 1430 985 1410 1000 Z" fill="#3f9b3a"/>
    <path d="M1280 990 H1500 L1475 1130 H1305 Z" fill="#e07a45"/>
    <rect x="1268" y="985" width="244" height="36" rx="6" fill="#ee8c57"/>
  </g>
  <g fill="#c98a2e" stroke="#26232e" stroke-width="4">
    <ellipse cx="640" cy="1010" rx="22" ry="10" transform="rotate(-20 640 1010)"/>
    <ellipse cx="910" cy="1120" rx="22" ry="10" transform="rotate(25 910 1120)"/>
    <ellipse cx="300" cy="1090" rx="22" ry="10" transform="rotate(10 300 1090)"/>
  </g>
  <ellipse cx="1390" cy="1135" rx="130" ry="14" fill="#26232e" opacity="0.18"/>

