    <circle cx="700" cy="140" r="9"/><circle cx="900" cy="152" r="9"/><circle cx="1100" cy="140" r="9"/>
    <circle cx="1300" cy="138" r="9"/><circle cx="1500" cy="140" r="9"/>
  </g>

