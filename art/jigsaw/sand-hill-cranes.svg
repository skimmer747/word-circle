    <ellipse cx="1300" cy="200" rx="85" ry="40"/>
    <ellipse cx="1490" cy="250" rx="60" ry="30"/>
    <ellipse cx="330" cy="165" rx="70" ry="32"/>
  </g>
  <g fill="none" stroke="#a9b8a0" stroke-width="12" stroke-linecap="round">
    <path d="M940 300 C930 330 950 350 938 380"/>
    <path d="M1040 330 C1030 360 1050 380 1040 420"/>
    <path d="M1380 360 C1370 390 1390 410 1380 440"/>
    <path d="M1500 375 C1490 400 1510 420 1500 450"/>
    <path d="M260 235 C250 260 270 280 258 310"/>
    <path d="M430 260 C420 285 440 300 430 330"/>
    <path d="M540 260 C530 280 550 300 540 320"/>
  </g>

  <!-- patio and its shadows -->
  <rect x="0" y="800" width="1600" height="400" fill="#f7e6c4" stroke="#26232e" stroke-width="6"/>
  <g stroke="#e0c99c" stroke-width="5">
    <path d="M0 880 H1600 M0 970 H1600 M0 1070 H1600"/>
    <path d="M200 800 V880 M520 800 V880 M840 800 V880 M1160 800 V880 M1480 800 V880 M60 880 V970 M380 880 V970 M700 880 V970 M1020 880 V970 M1340 880 V970 M220 970 V1070 M560 970 V1070 M900 970 V1070 M1240 970 V1070 M1580 970 V1070 M100 1070 V1200 M460 1070 V1200 M820 1070 V1200 M1180 1070 V1200 M1540 1070 V1200"/>
