  <path d="M1150 520 C1300 505 1450 530 1600 515 L1600 600 C1450 590 1300 610 1150 590 Z" fill="#55ad2c"/>

  <!-- oak tree: trunk, the long low branch, leaves and Spanish moss -->
  <path d="M1170 500 C1180 420 1160 330 1200 230 L1280 230 C1260 330 1270 420 1290 500 Z" fill="#6b4a32" stroke="#26232e" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1200 300 C1080 260 900 250 760 300 C650 340 560 330 470 290 L460 320 C560 370 660 375 770 335 C900 290 1060 300 1200 345 Z" fill="#6b4a32" stroke="#26232e" stroke-width="6" stroke-linejoin="round"/>
  <path d="M470 290 C440 270 420 250 400 250 M465 318 C440 330 420 345 400 350" stroke="#26232e" stroke-width="12" stroke-linecap="round" fill="none"/>
