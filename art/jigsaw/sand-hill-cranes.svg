  <path d="M140 140 V765 M1100 140 V765" stroke="#dde3e8" stroke-width="16"/>

  <!-- hanging basket of flowers -->
  <path d="M800 102 L780 250 M800 102 L820 250 M800 102 V250" stroke="#26232e" stroke-width="4"/>
  <path d="M760 250 H840 L825 300 H775 Z" fill="#e07a45" stroke="#26232e" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#ff5fa2" stroke="#26232e" stroke-width="4">
    <circle cx="772" cy="244" r="15"/><circle cx="800" cy="236" r="17"/><circle cx="828" cy="244" r="15"/>
  </g>
  <g fill="#ffe14a"><circle cx="772" cy="244" r="5"/><circle cx="800" cy="236" r="6"/><circle cx="828" cy="244" r="5"/></g>

  <!-- the two cranes -->
  <use xlink:href="#crane" transform="translate(470 640)"/>
  <use xlink:href="#crane" transform="translate(820 610) scale(1.05)"/>

  <!-- patio chair with a navy cushion -->
  <g stroke="#26232e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M60 920 L80 760 M220 920 L200 760" fill="none" stroke-width="10"/>
    <path d="M60 920 L80 760 M220 920 L200 760" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M50 760 L230 760 L250 600 L70 560 Z" fill="#ffffff"/>
    <path d="M90 600 L82 760 M130 590 L125 760 M170 595 L165 760 M210 600 L205 760 M62 640 L246 650 M58 690 L240 700 M54 730 L235 735" fill="none" stroke-width="4"/>
    <path d="M30 760 C30 730 250 730 260 760 C260 795 30 795 30 760 Z" fill="#2a4b9b"/>
  </g>
