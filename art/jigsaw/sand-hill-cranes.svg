<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <g id="cloud">
      <path d="M0 60 C-10 20 40 0 70 20 C90 -15 160 -10 170 30 C210 20 240 50 225 80 C230 100 210 112 190 110 L20 110 C-10 110 -20 80 0 60 Z"
        fill="#ffffff" stroke="#26232e" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g id="crane">
      <!-- shadow on the ground -->
      <ellipse cx="-40" cy="262" rx="120" ry="16" fill="#26232e" opacity="0.18"/>
      <!-- legs -->
      <path d="M-15 70 L-25 255 M15 70 L28 255" stroke="#26232e" stroke-width="14" stroke-linecap="round"/>
      <path d="M-15 70 L-25 255 M15 70 L28 255" stroke="#4a4a55" stroke-width="7" stroke-linecap="round"/>
      <path d="M-25 255 L-55 262 M-25 255 L5 262 M28 255 L-2 262 M28 255 L58 262" stroke="#26232e" stroke-width="7" stroke-linecap="round"/>
      <!-- neck -->
      <path d="M50 -15 C80 -60 60 -120 85 -165" fill="none" stroke="#26232e" stroke-width="30" stroke-linecap="round"/>
      <path d="M50 -15 C80 -60 60 -120 85 -165" fill="none" stroke="#b3b9c2" stroke-width="18" stroke-linecap="round"/>
      <!-- tail bustle -->
      <path d="M-60 0 C-105 10 -115 60 -80 80 C-60 70 -40 60 -35 40 Z" fill="#7d838d" stroke="#26232e" stroke-width="6" stroke-linejoin="round"/>
      <!-- body -->
      <path d="M-70 10 C-70 -40 10 -55 60 -25 C90 -8 88 35 55 58 C15 85 -70 70 -70 10 Z" fill="#b3b9c2" stroke="#26232e" stroke-width="6" stroke-linejoin="round"/>
      <!-- wing -->
      <path d="M-50 5 C-30 -20 30 -22 55 0 C30 20 -20 35 -50 5 Z" fill="#959ba5" stroke="#26232e" stroke-width="5" stroke-linejoin="round"/>
      <!-- head -->
      <circle cx="90" cy="-172" r="24" fill="#b3b9c2" stroke="#26232e" stroke-width="6"/>
      <path d="M72 -180 C74 -200 104 -202 110 -184 C100 -178 82 -176 72 -180 Z" fill="#e8343a" stroke="#26232e" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="96" cy="-160" rx="14" ry="9" fill="#ffffff"/>
      <circle cx="100" cy="-176" r="5" fill="#26232e"/>
      <circle cx="102" cy="-178" r="1.6" fill="#ffffff"/>
      <path d="M110 -172 L165 -158 L110 -160 Z" fill="#3b3b44" stroke="#26232e" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- sky and clouds -->
