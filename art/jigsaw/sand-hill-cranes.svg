    <rect x="-10" y="0" width="1620" height="40" fill="#e9edf0"/>
    <rect x="300" y="-6" width="34" height="52" fill="#e9edf0"/>
    <rect x="640" y="-6" width="34" height="52" fill="#e9edf0"/>
    <rect x="980" y="-6" width="34" height="52" fill="#e9edf0"/>
    <rect x="1320" y="-6" width="34" height="52" fill="#e9edf0"/>
