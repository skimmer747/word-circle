  <g stroke="#26232e" stroke-width="6" stroke-linejoin="round">
    <rect x="80" y="102" width="80" height="700" fill="#ffffff"/>
    <rect x="66" y="102" width="108" height="30" fill="#ffffff"/>
    <rect x="62" y="772" width="116" height="34" fill="#ffffff"/>
    <rect x="1040" y="102" width="80" height="700" fill="#ffffff"/>
    <rect x="1026" y="102" width="108" height="30" fill="#ffffff"/>
    <rect x="1022" y="772" width="116" height="34" fill="#ffffff"/>
